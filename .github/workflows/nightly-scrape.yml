name: Nightly Split Collector

on:
  schedule:
    # 04:17 UTC = 00:17 EDT / 23:17 EST. GitHub starts scheduled workflows late, and
    # through September 2026 this job (then at 09:00 UTC) began 4-8 hours late - after
    # the 09:25 ET trading run it feeds. A signal can only be entered on the session
    # after its filing, so every one that landed late was lost. Early and off the top
    # of the hour leaves room for that delay. The Modal `scan` function in
    # modal_app.py is the on-time path; this one is the backup and runs the scrapers.
    - cron: "17 4 * * *"
  workflow_dispatch: # Allow manual triggering from GitHub Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run stock split collector (web scraping)
        # MONGODB_DATABASE/MONGODB_COLLECTION are intentionally NOT set here: they're
        # optional with safe defaults in config.py, and referencing an unset GitHub
        # secret sets the env var to an empty string (not "unset"), which would
        # silently override the Python default with "". Only add these as secrets +
        # env vars here if you actually need non-default values.
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          python -m split_strategy.scrapers.runner

      - name: Run EDGAR batch processor
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          # SEC fair-access requires a real contact. Set this repo secret to
          # "Your Name your.real@email.com" - see docs/VALIDATION_REPORT.md.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python scripts/nightly_job.py
      
      - name: Run Early Edgar Scanner (daily)
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/scan_early_edgar.py

      # No signal/SMS step here on purpose: run_trading.py on the user's PC
      # (docs/LIVE_DEPLOYMENT.md, Task Scheduler ~9:25am ET weekdays) is now the single
      # source of signal alerts, dry-run and eventually live alike. Running a second,
      # separate alerting path here would double-text on the same signal and would be
      # stateless (no persistent position ledger in CI) unlike the real one. This job's
      # only remaining purpose is data collection: scrapers -> EDGAR enrichment -> scan.
