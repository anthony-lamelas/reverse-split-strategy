name: Nightly Split Collector

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC (05:00 AM EST)
  workflow_dispatch: # Allow manual triggering from GitHub Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run stock split collector (web scraping)
        # MONGODB_DATABASE/MONGODB_COLLECTION are intentionally NOT set here: they're
        # optional with safe defaults in config.py, and referencing an unset GitHub
        # secret sets the env var to an empty string (not "unset"), which would
        # silently override the Python default with "". Only add these as secrets +
        # env vars here if you actually need non-default values.
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          python -m split_strategy.scrapers.runner

      - name: Run EDGAR batch processor
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          # SEC fair-access requires a real contact. Set this repo secret to
          # "Your Name your.real@email.com" - see docs/VALIDATION_REPORT.md.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python scripts/nightly_job.py
      
      - name: Run Early Edgar Scanner (daily)
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/scan_early_edgar.py

      - name: Run daily signal check (dry-run, SMS alert)
        # Dry-run only - never places real orders. --no-schwab-check because CI has no
        # cached Schwab token (the OAuth login is an interactive, ~weekly, local step -
        # see docs/SCHWAB_SETUP.md). This step is stateless: the capital ledger used
        # locally (DATA/open_positions_*.json) doesn't persist across CI runs, so each
        # run assumes $0 already committed. That's fine for an informational alert, but
        # don't treat it as an authoritative "you have capital available" signal if
        # you're also trading manually or locally.
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: |
          python scripts/run_signals.py --min-confidence High --no-schwab-check
