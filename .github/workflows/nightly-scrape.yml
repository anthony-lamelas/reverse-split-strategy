name: Nightly Split Collector

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC (05:00 AM EST)
  workflow_dispatch: # Allow manual triggering from GitHub Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run stock split collector (web scraping)
        # MONGODB_DATABASE/MONGODB_COLLECTION are intentionally NOT set here: they're
        # optional with safe defaults in config.py, and referencing an unset GitHub
        # secret sets the env var to an empty string (not "unset"), which would
        # silently override the Python default with "". Only add these as secrets +
        # env vars here if you actually need non-default values.
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          python -m split_strategy.scrapers.runner

      - name: Run EDGAR batch processor
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          # SEC fair-access requires a real contact. Set this repo secret to
          # "Your Name your.real@email.com" - see docs/VALIDATION_REPORT.md.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python scripts/nightly_job.py
      
      - name: Run Early Edgar Scanner (daily)
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/scan_early_edgar.py

      - name: Run daily signal report (SMS alert)
        # run_signals.py cannot place an order by construction - it has no order code
        # at all. Trading lives in run_trading.py, which only runs on a machine with a
        # persistent Schwab token and position ledger (docs/LIVE_DEPLOYMENT.md).
        #
        # --no-schwab-check because CI has no cached token; the OAuth login is
        # interactive and expires every 7 days. This step is also stateless: the
        # position ledger doesn't persist across CI runs, so committed capital reads as
        # $0 here. Treat these alerts as "a signal fired", not as portfolio state.
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: |
          python scripts/run_signals.py --min-confidence High --no-schwab-check
